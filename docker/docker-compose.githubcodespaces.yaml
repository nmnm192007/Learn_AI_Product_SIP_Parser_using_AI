services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: sip_parser_api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../data:/app/data
      - ../.hf_cache:/root/.cache/huggingface
    depends_on:
      - ollama
  
  ollama:
    image: ollama/ollama:latest
    container_name: sip_parser_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

volumes:
  ollama_data:
